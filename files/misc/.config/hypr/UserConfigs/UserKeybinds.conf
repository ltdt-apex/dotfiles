# Default Keybinds
# visit https://wiki.hyprland.org/Configuring/Binds/ for more info

# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 


$mainMod = SUPER
$files = thunar
$term = kitty
# Default
$scriptsDir = $HOME/.config/hypr/scripts
# $configs = $HOME/.config/hypr/configs
# User
$UserScripts = $HOME/.config/hypr/UserScripts
# $UserConfigs = $HOME/.config/hypr/UserConfigs

bind = CTRL ALT, Delete, exec, hyprctl dispatch exit 0
bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen, 0
# bind = $mainMod SHIFT, F, fullscreen, 1
# bind = $mainMod SHIFT, Q, exec, $scriptsDir/KillActiveProcess.sh
bind = $mainMod SHIFT, F, togglefloating
bind = $mainMod SHIFT, F, centerwindow

# bind = $mainMod ALT, F, exec, hyprctl dispatch workspaceopt allfloat
# bind = CTRL ALT, L, exec, $scriptsDir/LockScreen.sh
# bind = CTRL ALT, P, exec, $scriptsDir/Wlogout.sh

# FEATURES / EXTRAS
bind = $mainMod, H, exec, $scriptsDir/KeyHints.sh # Small help file
bind = $mainMod ALT, R, exec, $scriptsDir/Refresh.sh # Refresh waybar, swaync, rofi
bind = $mainMod ALT, E, exec, $scriptsDir/RofiEmoji.sh # emoji
bind = $mainMod CTRL, C, exec, $scriptsDir/ColorPicker.sh # emoji
bind = $mainMod, S, exec, $scriptsDir/RofiSearch.sh # Google search from Rofi
bind = $mainMod SHIFT, B, exec, $scriptsDir/ChangeBlur.sh # Toggle blur settings
bind = $mainMod SHIFT, G, exec, $scriptsDir/GameMode.sh # animations ON/OFF
bind = $mainMod ALT, L, exec, $scriptsDir/ChangeLayout.sh # Toggle Master or Dwindle Layout
bind = $mainMod ALT, V, exec, $scriptsDir/ClipManager.sh # Clipboard Manager
bind = $mainMod SHIFT, N, exec, swaync-client -t -sw # swayNC panel

# FEATURES / EXTRAS (scriptsDir)
bind = $mainMod, E, exec, $scriptsDir/QuickEdit.sh # Quick Edit Hyprland Settings
# bind = $mainMod SHIFT, M, exec, $scriptsDir/RofiBeats.sh # online music
bind = $mainMod, W, exec, $scriptsDir/WallpaperSelect.sh # Select wallpaper to apply
# bind = $mainMod SHIFT, W, exec, $scriptsDir/WallpaperEffects.sh # Wallpaper Effects by imagemagickWW
# bind = CTRL ALT, W, exec, $scriptsDir/WallpaperRandom.sh # Random wallpapers

# Waybar / Bar related
bind = $mainMod, B, exec, killall -SIGUSR1 waybar # Toggle hide/show waybar
# bind = $mainMod CTRL, B, exec, $scriptsDir/WaybarStyles.sh # Waybar Styles Menu
# bind = $mainMod ALT, B, exec, $scriptsDir/WaybarLayout.sh # Waybar Layout Menu

# Master Layout
# bind = $mainMod CTRL, D, layoutmsg, removemaster
# bind = $mainMod, I, layoutmsg, addmaster
# bind = $mainMod, J, layoutmsg, cyclenext
# bind = $mainMod, K, layoutmsg, cycleprev
# bind = $mainMod, M, exec, hyprctl dispatch splitratio 0.3
# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod CTRL, Return, layoutmsg, swapwithmaster

# group
bind = $mainMod, G, togglegroup
bind = $mainMod SHIFT, tab, changegroupactive  #change focus to another window

 # Cycle windows if floating bring to top
bind = ALT,Tab,cyclenext
bind = ALT,Tab,bringactivetotop

# Special Keys / Hot Keys
bindel = , xf86audioraisevolume, exec, $scriptsDir/Volume.sh --inc #volume up
bindel = , xf86audiolowervolume, exec, $scriptsDir/Volume.sh --dec #volume down
bindl = , xf86AudioMicMute, exec, $scriptsDir/Volume.sh --toggle-mic #mute mic
bindl = , xf86audiomute, exec, $scriptsDir/Volume.sh --toggle
bindl = , xf86Sleep, exec, systemctl suspend  # sleep button
bindl = , xf86Rfkill, exec, $scriptsDir/AirplaneMode.sh #Airplane mode

# media controls using keyboards
bindl = , xf86AudioPlayPause, exec, $scriptsDir/MediaCtrl.sh --pause
bindl = , xf86AudioPause, exec, $scriptsDir/MediaCtrl.sh --pause
bindl = , xf86AudioPlay, exec, $scriptsDir/MediaCtrl.sh --pause
bindl = , xf86AudioNext, exec, $scriptsDir/MediaCtrl.sh --nxt
bindl = , xf86AudioPrev, exec, $scriptsDir/MediaCtrl.sh --prv
bindl = , xf86audiostop, exec, $scriptsDir/MediaCtrl.sh --stop

# Screenshot keybindings NOTE: You may need to press Fn key as well
bind = $mainMod, Print, exec, $scriptsDir/ScreenShot.sh --now
bind = $mainMod SHIFT, Print, exec, $scriptsDir/ScreenShot.sh --area
bind = $mainMod CTRL, Print, exec, $scriptsDir/ScreenShot.sh --in5 #screenshot in 5 secs
bind = $mainMod CTRL SHIFT, Print, exec, $scriptsDir/ScreenShot.sh --in10 #screenshot in 10 secs
bind = ALT, Print, exec, $scriptsDir/ScreenShot.sh --active #take screenshot of active window

# screenshot with swappy (another screenshot tool)
bind = $mainMod SHIFT, S, exec, $scriptsDir/ScreenShot.sh --swappy

# Workspaces related
bind = $mainMod, tab, workspace, m+1
bind = $mainMod SHIFT, tab, workspace, m-1

# Special workspace
bind = $mainMod SHIFT, U, movetoworkspace, special
bind = $mainMod, U, togglespecialworkspace,

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, period, workspace, e+1
bind = $mainMod, comma, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# rofi App launcher
#bindr = $mainMod, $mainMod_L, exec, pkill rofi || rofi -show drun -modi drun,filebrowser,run,window # Super Key to Launch rofi menu
bind = $mainMod, D, exec, pkill rofi || rofi -show drun -modi drun,filebrowser,run,window

# ags overview
bind = $mainMod, A, exec, pkill rofi || true && ags -t 'overview'

bind = $mainMod, Return, exec, $term  # Launch terminal
bind = $mainMod, T, exec, $files # Launch file manager

bind = $mainMod ALT, C, exec, $scriptsDir/RofiCalc.sh # calculator (qalculate)
bind = $mainMod ALT, P, exec, $scriptsDir/RofiPercent.sh # calculator (qalculate)

# pyprland
bind = $mainMod SHIFT, Return, exec, pypr toggle term # Dropdown terminal
bind = $mainMod SHIFT, J, exec, pypr toggle browser # Dropdown firefox
bind = $mainMod, Z, exec, pypr zoom # Toggle Zoom

# User Added Keybinds
bind = $mainMod SHIFT, O, exec, $scriptsDir/ZshChangeTheme.sh # Change oh-my-zsh theme
# bindn = ALT_L, SHIFT_L, exec, $scriptsDir/SwitchKeyboardLayout.sh # Changing the keyboard layout

# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset

#####################
#####################
## Custom Keybinds ##
#####################
#####################

# move/resize window
# move window to the direction in floating mode
# swap window to the direction in tiled mode
binde = $mainMod, left, exec, $UserScripts/ResizeWindow.sh left
binde = $mainMod, right, exec, $UserScripts/ResizeWindow.sh right
binde = $mainMod, up, exec, $UserScripts/ResizeWindow.sh up
binde = $mainMod, down, exec, $UserScripts/ResizeWindow.sh down
# bind = $mainMod CTRL, left, movewindow, l
# bind = $mainMod CTRL, right, movewindow, r
# bind = $mainMod CTRL, up, movewindow, u
# bind = $mainMod CTRL, down, movewindow, d

# resize window to the direction
binde = $mainMod SHIFT, left, exec, $UserScripts/ResizeWindow.sh resizeleft
binde = $mainMod SHIFT, right, exec, $UserScripts/ResizeWindow.sh resizeright
binde = $mainMod SHIFT, up, exec, $UserScripts/ResizeWindow.sh resizeup
binde = $mainMod SHIFT, down, exec, $UserScripts/ResizeWindow.sh resizedown

binde = $mainMod, X, exec, $UserScripts/ResizeWindow.sh resize
bind = $mainMod, C, centerwindow

# Toggle window opacity
bind = $mainMod, O, exec, $UserScripts/ToggleAllOpacity.sh  # Toggle all window opacity to 1
# bind = $mainMod O, exec, $UserScripts/ToggleOpacity.sh  # Toggle window opacity to 1

# Switch workspaces
bind = $mainMod, code:10, exec, $UserScripts/SwitchWorkspace.sh 1
bind = $mainMod, code:11, exec, $UserScripts/SwitchWorkspace.sh 2
bind = $mainMod, code:12, exec, $UserScripts/SwitchWorkspace.sh 3
bind = $mainMod, code:13, exec, $UserScripts/SwitchWorkspace.sh 4
bind = $mainMod, code:14, exec, $UserScripts/SwitchWorkspace.sh 5

# Move active window to a workspace
bind = $mainMod SHIFT, code:10, exec, $UserScripts/SwitchWorkspace.sh 1 move
bind = $mainMod SHIFT, code:11, exec, $UserScripts/SwitchWorkspace.sh 2 move
bind = $mainMod SHIFT, code:12, exec, $UserScripts/SwitchWorkspace.sh 3 move
bind = $mainMod SHIFT, code:13, exec, $UserScripts/SwitchWorkspace.sh 4 move
bind = $mainMod SHIFT, code:14, exec, $UserScripts/SwitchWorkspace.sh 5 move
bind = $mainMod SHIFT, bracketleft, exec, $UserScripts/SwitchWorkspace.sh -1 move
bind = $mainMod SHIFT, bracketright, exec, $UserScripts/SwitchWorkspace.sh +1 move

# Move active window to a workspace silently
bind = $mainMod CTRL, code:10, exec, $UserScripts/SwitchWorkspace.sh 1 silently
bind = $mainMod CTRL, code:11, exec, $UserScripts/SwitchWorkspace.sh 2 silently
bind = $mainMod CTRL, code:12, exec, $UserScripts/SwitchWorkspace.sh 3 silently
bind = $mainMod CTRL, code:13, exec, $UserScripts/SwitchWorkspace.sh 4 silently
bind = $mainMod CTRL, code:14, exec, $UserScripts/SwitchWorkspace.sh 5 silently
bind = $mainMod CTRL, bracketleft, exec, $UserScripts/SwitchWorkspace.sh -1 silently
bind = $mainMod CTRL, bracketright, exec, $UserScripts/SwitchWorkspace.sh +1 silently